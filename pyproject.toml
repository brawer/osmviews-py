[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "osmviews"
version = "0.2.2"
description = "Ranking geographic locations by how much they are viewed on OpenStreetMap-based maps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sascha Brawer", email = "sascha@brawer.ch" }]
requires-python = ">=3.11"
keywords = ["openstreetmap", "osm", "geo", "ranking", "geotiff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/brawer/osmviews-py"
Documentation = "https://github.com/brawer/osmviews-py/blob/main/README.md"
Changelog = "https://github.com/brawer/osmviews-py/blob/main/CHANGELOG.md"
Source = "https://github.com/brawer/osmviews-py"
"Bug Tracker" = "https://github.com/brawer/osmviews-py/issues"
Funding = "https://github.com/sponsors/brawer"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.11"]

[tool.uv.build-backend]
module-name = "osmviews"
# The module under src/ is in the sdist by default; also ship the tests,
# benchmark and design docs so downstream packagers (Linux distros,
# conda-forge) can build and test from it.
source-include = [
    "tests/**",
    "benchmarks/**",
    "CHANGELOG.md",
    "TECHNICAL_DESIGN.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/osmviews"]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # long lines are the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]  # nested `with` blocks read fine in tests
