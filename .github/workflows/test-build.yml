name: Run tests and build Python package

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv run --group dev ruff check
      - run: uv run --group dev ruff format --check
      # Enforce SHA-pinned actions and other workflow-security rules.
      - run: uvx zizmor@1.30.0 --persona=regular .github/workflows/

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      # The ~594 MB real-dataset test stays skipped here (no OSMVIEWS_TIFF).
      - run: uv run --group dev pytest -q
      - run: uv build
