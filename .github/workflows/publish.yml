# SPDX-License-Identifier: MIT
#
# Runs the full test suite against the real dataset, builds the distributions,
# attests their build provenance, and publishes to PyPI via Trusted Publishing.
# See RELEASING.md.
#
# release-please pushes the vX.Y.Z tag as a GitHub App (see release-please.yml),
# so `push: tags` launches this automatically after a release PR is merged. The
# `workflow_dispatch` trigger is a fallback for re-running a release:
#
#     gh workflow run publish.yml --ref vX.Y.Z

name: Publish Python package to PyPI

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Tag matches pyproject.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag: $tag    pyproject.toml: $version"
          test "$tag" = "$version"

      # The dataset is published as a Frictionless data package: its descriptor
      # names the current raster (a dated, immutable file) with its SHA-256.
      # See https://github.com/brawer/osmviews/blob/main/docs/downloads.md.
      # The path and hash come from the network, so check their shape before
      # they reach a URL, a cache key or a shell.
      - name: Resolve the current OSMViews dataset
        id: dataset
        run: |
          curl -fsSL -o datapackage.json \
            --connect-timeout 60 --retry 5 --retry-delay 15 --retry-all-errors \
            https://osmviews.brawer.ch/data/datapackage.json
          raster='.resources[] | select(.name == "osmviews")'
          path=$(jq -er "$raster | .path" datapackage.json)
          hash=$(jq -er "$raster | .hash" datapackage.json)
          [[ "$path" =~ ^osmviews-[0-9]{8}\.tiff$ ]] || { echo "unexpected path: $path"; exit 1; }
          [[ "$hash" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected hash: $hash"; exit 1; }
          echo "$path  $hash"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=${hash#sha256:}" >> "$GITHUB_OUTPUT"

      # Each raster file is immutable, so key the cache by its name: at most one
      # download per weekly build, however often this workflow runs.
      - name: Cache the OSMViews dataset
        id: dataset-cache
        # Safe against cache poisoning: this workflow has no `pull_request`
        # trigger, so only a release tag or a manual dispatch can write the
        # cache, and its only consumer is the online test below -- never the
        # `uv build` in the `build` job, which checks out fresh.
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: osmviews.tiff
          key: ${{ steps.dataset.outputs.path }}

      - name: Download the OSMViews dataset
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        env:
          RASTER_PATH: ${{ steps.dataset.outputs.path }}
        run: |
          # Retry generously, but give up on a connection that stalls below
          # 1 KiB/s for 5 minutes so a dead transfer fails in minutes instead of
          # hanging for hours.
          curl -fSL -o osmviews.tiff \
            --connect-timeout 60 --retry 5 --retry-delay 15 --retry-all-errors \
            --speed-limit 1024 --speed-time 300 \
            "https://osmviews.brawer.ch/data/$RASTER_PATH"

      # Also checked on a cache hit, so a corrupt cache entry fails loudly.
      - name: Verify the dataset against the data package
        env:
          RASTER_SHA256: ${{ steps.dataset.outputs.sha256 }}
        run: echo "$RASTER_SHA256  osmviews.tiff" | sha256sum --check --strict

      - name: Run the full test suite, including the real-dataset test
        run: OSMVIEWS_TIFF="$PWD/osmviews.tiff" uv run --group dev pytest -q

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # write the provenance to the attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv build

      # SLSA build-provenance attestation for the sdist and wheel, keyed to their
      # SHA-256 digests and stored in this repo's attestation store (not attached
      # to the release, which is immutable). Verify with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
